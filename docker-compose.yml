version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: auxbase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: auxbase_user
      POSTGRES_PASSWORD: auxbase_pass
      POSTGRES_DB: auxbase
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auxbase_user -d auxbase']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: auxbase-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://auxbase_user:auxbase_pass@postgres:5432/auxbase?schema=public
      JWT_ACCESS_SECRET: auxbase_access_secret_change_in_prod
      JWT_REFRESH_SECRET: auxbase_refresh_secret_change_in_prod
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173
    ports:
      - '5000:5000'

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: auxbase-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '5173:80'

volumes:
  postgres_data: